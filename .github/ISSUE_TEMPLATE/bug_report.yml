name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click "Record selection"
        2. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.3
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      placeholder: MacBook Pro, M3
  - type: input
    id: version
    attributes:
      label: Clipt version or commit
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a short recording, or logs help a lot.
