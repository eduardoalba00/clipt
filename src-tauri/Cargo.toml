[package]
name = "clipt"
version = "0.1.0"
description = "A tiny screen recorder for clean demo videos"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "clipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-image = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = "0.3"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true

# Owns the main thread so it can drive AVPlayer the way the app does.
[[test]]
name = "parity"
harness = false
